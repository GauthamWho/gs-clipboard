<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="How G's Clipboard works: copy, press Option V, click to reuse">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#E8F1FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2E82"/>
      <stop offset="1" stop-color="#2E7BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12306A" flood-opacity="0.14"/>
    </filter>
    <style>
      .h { font-family: "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif; font-weight: 800; fill: #0B2E82; }
      .t { font-family: "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif; font-weight: 700; fill: #0B2E82; }
      .b { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; fill: #4A6087; }
      .num { font-family: "SF Pro Rounded", -apple-system, sans-serif; font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#page)"/>
  <text class="h" x="600" y="64" font-size="34" text-anchor="middle">How it works</text>
  <text class="b" x="600" y="96" font-size="17" text-anchor="middle">Three seconds, every time.</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="54" y="130" width="330" height="230" rx="26" fill="#FFFFFF"/>
  </g>
  <circle cx="104" cy="180" r="22" fill="url(#blue)"/>
  <text class="num" x="104" y="188" font-size="20" text-anchor="middle">1</text>
  <g transform="translate(160, 152)">
    <rect x="0" y="0" width="72" height="56" rx="12" fill="#EAF2FF"/>
    <rect x="24" y="-6" width="24" height="12" rx="5" fill="#2E7BFF"/>
    <rect x="12" y="18" width="48" height="6" rx="3" fill="#9CC0FF"/>
    <rect x="12" y="30" width="34" height="6" rx="3" fill="#9CC0FF"/>
  </g>
  <text class="t" x="86" y="254" font-size="25">Copy anything</text>
  <text class="b" x="86" y="286" font-size="16">Text, screenshots, photos,</text>
  <text class="b" x="86" y="310" font-size="16">file paths — all saved.</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="435" y="130" width="330" height="230" rx="26" fill="#FFFFFF"/>
  </g>
  <circle cx="485" cy="180" r="22" fill="url(#blue)"/>
  <text class="num" x="485" y="188" font-size="20" text-anchor="middle">2</text>
  <g transform="translate(540, 160)">
    <rect x="0" y="0" width="54" height="44" rx="10" fill="#0B2E82"/>
    <text x="27" y="31" font-size="22" text-anchor="middle" fill="#FFFFFF"
          font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="700">⌥</text>
    <rect x="66" y="0" width="44" height="44" rx="10" fill="#EAF2FF"/>
    <text x="88" y="31" font-size="21" text-anchor="middle" fill="#0B45C4"
          font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="700">V</text>
  </g>
  <text class="t" x="467" y="254" font-size="25">Press ⌥V</text>
  <text class="b" x="467" y="286" font-size="16">The panel appears anywhere —</text>
  <text class="b" x="467" y="310" font-size="16">recent items first, scroll for more.</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="816" y="130" width="330" height="230" rx="26" fill="#FFFFFF"/>
  </g>
  <circle cx="866" cy="180" r="22" fill="url(#blue)"/>
  <text class="num" x="866" y="188" font-size="20" text-anchor="middle">3</text>
  <g transform="translate(920, 154)">
    <rect x="0" y="0" width="92" height="52" rx="9" fill="#EAF2FF"/>
    <rect x="10" y="10" width="52" height="7" rx="3" fill="#9CC0FF"/>
    <rect x="10" y="24" width="66" height="7" rx="3" fill="#BFD6FF"/>
    <rect x="10" y="38" width="40" height="7" rx="3" fill="#BFD6FF"/>
    <path d="M64 34 l16 22 l7 -7 l7 7 l4 -4 l-7 -7 l7 -7 z" fill="#0B2E82"/>
  </g>
  <text class="t" x="848" y="254" font-size="25">Click to reuse</text>
  <text class="b" x="848" y="286" font-size="16">It goes back on your clipboard.</text>
  <text class="b" x="848" y="310" font-size="16">Press ⌘V to paste.</text>

  <!-- Arrows -->
  <path d="M392 245 h30" stroke="#8FB4F0" stroke-width="4" stroke-linecap="round"/>
  <path d="M416 239 l10 6 l-10 6" fill="none" stroke="#8FB4F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M773 245 h30" stroke="#8FB4F0" stroke-width="4" stroke-linecap="round"/>
  <path d="M797 239 l10 6 l-10 6" fill="none" stroke="#8FB4F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
