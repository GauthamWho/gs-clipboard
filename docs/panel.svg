<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760" role="img" aria-label="G's Clipboard panel with recent items">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#E6F0FF"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2E82"/>
      <stop offset="1" stop-color="#2E7BFF"/>
    </linearGradient>
    <filter id="pshadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0B2E82" flood-opacity="0.22"/>
    </filter>
    <style>
      .row { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; fill: #16233D; font-size: 14px; }
      .meta { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; fill: #7A8AA6; font-size: 11px; }
      .foot { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; fill: #7A8AA6; font-size: 11px; }
      .search { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; fill: #93A2BA; font-size: 13px; }
    </style>
  </defs>

  <rect width="620" height="760" fill="url(#pbg)"/>
  <g filter="url(#pshadow)" transform="translate(60, 40)">
    <rect x="0" y="0" width="500" height="660" rx="18" fill="#FFFFFF"/>

    <!-- Search bar -->
    <circle cx="30" cy="34" r="7" fill="none" stroke="#93A2BA" stroke-width="2"/>
    <path d="M35 39 l6 6" stroke="#93A2BA" stroke-width="2" stroke-linecap="round"/>
    <text class="search" x="52" y="39">Search history</text>
    <line x1="0" y1="62" x2="500" y2="62" stroke="#E7EDF7" stroke-width="1"/>

    <!-- Row 1 (pinned text) -->
    <g transform="translate(0, 64)">
      <rect x="14" y="14" width="40" height="40" rx="8" fill="#EAF2FF"/>
      <path d="M27 26 h14 M27 32 h14 M27 38 h9" stroke="#2E7BFF" stroke-width="2.4" stroke-linecap="round"/>
      <text class="row" x="68" y="30">Meeting notes — Tuesday standup</text>
      <text class="meta" x="68" y="48">2 minutes ago · Notes</text>
      <path d="M462 22 l7 4 v8 l-7 4 l-7 -4 v-8 z" fill="none" stroke="#F59E0B" stroke-width="1.8"/>
      <text class="meta" x="452" y="52">pin</text>
      <line x1="14" y1="68" x2="486" y2="68" stroke="#EEF3FB" stroke-width="1"/>
    </g>

    <!-- Row 2 (image) -->
    <g transform="translate(0, 132)">
      <rect x="14" y="12" width="40" height="40" rx="8" fill="url(#thumb)"/>
      <circle cx="27" cy="25" r="4" fill="#FFFFFF" opacity="0.9"/>
      <path d="M16 45 l11 -11 l8 8 l5 -5 l8 8 v3 h-32 z" fill="#FFFFFF" opacity="0.85"/>
      <text class="row" x="68" y="29">Screenshot 2026-11-04 at 10.14</text>
      <text class="meta" x="68" y="47">5 minutes ago · Screenshot</text>
      <line x1="14" y1="66" x2="486" y2="66" stroke="#EEF3FB" stroke-width="1"/>
    </g>

    <!-- Row 3 (link) -->
    <g transform="translate(0, 198)">
      <rect x="14" y="12" width="40" height="40" rx="8" fill="#EAF2FF"/>
      <path d="M29 26 a5 5 0 0 1 7 0 l4 4 a5 5 0 0 1 -7 7 l-2 -2" fill="none" stroke="#2E7BFF" stroke-width="2" stroke-linecap="round"/>
      <path d="M39 44 a5 5 0 0 1 -7 0 l-4 -4 a5 5 0 0 1 7 -7 l2 2" fill="none" stroke="#2E7BFF" stroke-width="2" stroke-linecap="round"/>
      <text class="row" x="68" y="29">github.com/GauthamWho/gs-clipboard</text>
      <text class="meta" x="68" y="47">12 minutes ago · Safari</text>
      <line x1="14" y1="66" x2="486" y2="66" stroke="#EEF3FB" stroke-width="1"/>
    </g>

    <!-- Row 4 (text) -->
    <g transform="translate(0, 264)">
      <rect x="14" y="12" width="40" height="40" rx="8" fill="#EAF2FF"/>
      <path d="M27 24 h14 M27 30 h14 M27 36 h14 M27 42 h8" stroke="#2E7BFF" stroke-width="2.4" stroke-linecap="round"/>
      <text class="row" x="68" y="29">Invoice #2481 — paid, ₹4,200</text>
      <text class="meta" x="68" y="47">20 minutes ago · Mail</text>
      <line x1="14" y1="66" x2="486" y2="66" stroke="#EEF3FB" stroke-width="1"/>
    </g>

    <!-- Row 5 (image) -->
    <g transform="translate(0, 330)">
      <rect x="14" y="12" width="40" height="40" rx="8" fill="#DCE8FF"/>
      <circle cx="34" cy="32" r="9" fill="#2E7BFF"/>
      <path d="M34 27 v10 M29 32 h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text class="row" x="68" y="29">Screenshot 2026-11-03 at 22.02</text>
      <text class="meta" x="68" y="47">Yesterday · Screenshot</text>
      <line x1="14" y1="66" x2="486" y2="66" stroke="#EEF3FB" stroke-width="1"/>
    </g>

    <!-- Row 6 -->
    <g transform="translate(0, 396)">
      <rect x="14" y="12" width="40" height="40" rx="8" fill="#EAF2FF"/>
      <path d="M27 24 h14 M27 30 h14 M27 36 h14 M27 42 h8" stroke="#9CC0FF" stroke-width="2.4" stroke-linecap="round"/>
      <text class="row" x="68" y="29">API key for the staging server</text>
      <text class="meta" x="68" y="47">2 days ago · Terminal</text>
    </g>

    <!-- Fade for scrolling -->
    <rect x="0" y="536" width="500" height="26" fill="#FFFFFF" opacity="0.9"/>

    <!-- Footer -->
    <line x1="0" y1="576" x2="500" y2="576" stroke="#E7EDF7" stroke-width="1"/>
    <text class="foot" x="16" y="604">42 items</text>
    <text class="foot" x="404" y="604">Clear</text>
    <text class="foot" x="452" y="604">⚙︎</text>
    <text class="foot" x="478" y="604">⏻</text>

    <!-- Arrow/label -->
    <g transform="translate(330, 664)">
      <rect x="0" y="0" width="168" height="34" rx="17" fill="#0B2E82"/>
      <text x="84" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13"
            font-family="SF Pro Rounded, -apple-system, sans-serif" font-weight="600">⌥V opens this</text>
    </g>
  </g>
</svg>
