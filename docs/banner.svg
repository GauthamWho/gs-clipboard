<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="G's Clipboard — copy once, find it forever">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2E82"/>
      <stop offset="0.55" stop-color="#1249C8"/>
      <stop offset="1" stop-color="#1C6CFF"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001133" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font-family: "SF Pro Rounded", "SF Pro Display", -apple-system, "Segoe UI", sans-serif; font-weight: 800; fill: #FFFFFF; }
      .sub { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; fill: #D6E4FF; }
      .chip { font-family: "SF Pro Display", -apple-system, "Segoe UI", sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 16px; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="0" fill="url(#bg)"/>
  <circle cx="1180" cy="20" r="240" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="80" cy="360" r="180" fill="#FFFFFF" opacity="0.05"/>

  <text class="title" x="72" y="136" font-size="66">G's Clipboard</text>
  <text class="sub" x="74" y="186" font-size="25">Copy once. Find it forever.</text>
  <text class="sub" x="74" y="224" font-size="17" opacity="0.85">A free clipboard history for macOS — no account, no subscription, nothing leaves your Mac.</text>

  <g transform="translate(74, 262)">
    <rect x="0" y="0" width="122" height="38" rx="19" fill="#FFFFFF" opacity="0.14"/>
    <text class="chip" x="61" y="25" text-anchor="middle">100% local</text>
    <rect x="134" y="0" width="132" height="38" rx="19" fill="#FFFFFF" opacity="0.14"/>
    <text class="chip" x="200" y="25" text-anchor="middle">Free forever</text>
    <rect x="278" y="0" width="118" height="38" rx="19" fill="#FFFFFF" opacity="0.14"/>
    <text class="chip" x="337" y="25" text-anchor="middle">macOS 14+</text>
  </g>

  <g filter="url(#soft)" transform="translate(1024, 62)">
    <rect x="0" y="0" width="166" height="216" rx="32" fill="url(#board)"/>
    <rect x="52" y="-12" width="62" height="34" rx="12" fill="#2E7BFF"/>
    <rect x="66" y="0" width="34" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
    <text x="83" y="152" text-anchor="middle" font-family="SF Pro Rounded, -apple-system, sans-serif"
          font-size="118" font-weight="800" fill="#0B45C4">G</text>
  </g>
</svg>
